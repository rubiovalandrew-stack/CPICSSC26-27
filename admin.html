<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPIC Admin</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="admin">

<div class="login-box" id="loginBox">
  <form class="panel" id="loginForm" style="width:100%;max-width:380px">
    <h1 style="font-size:1.8rem">Admin login</h1>
    <label for="user">Admin email</label>
    <input type="email" id="user" autocomplete="username" required>
    <label for="pass">Password</label>
    <input type="password" id="pass" autocomplete="current-password" required>
    <p id="loginErr" role="alert" style="color:var(--red);min-height:1.4em;margin:8px 0 0"></p>
    <button class="btn" type="submit">Log in</button>
    <a class="btn ghost" href="index.html" style="margin-left:6px">Back to site</a>
  </form>
</div>

<div id="dash" class="hidden">
  <header class="top"><div class="wrap">
    <span class="brand">CPIC<span>.</span> Admin</span>
    <nav><a href="index.html" target="_blank">View student page</a><a href="#" id="logout">Log out</a></nav>
  </div></header>

  <main class="wrap">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="tMsg">Messages <span class="badge hidden" id="pendBadge">0</span></button>
      <button role="tab" aria-selected="false" data-tab="tNews">News</button>
      <button role="tab" aria-selected="false" data-tab="tImg">Images</button>
    </div>

    <div class="tabpane" id="tMsg">
      <h2>Anonymous messages</h2>
      <p class="sub">Pending messages are shown first. Only messages marked "Post it" appear on the student page.</p>
      <div id="msgList"></div>
    </div>

    <div class="tabpane hidden" id="tNews">
      <div class="admin-grid two">
        <form class="panel" id="newsForm">
          <h2>Post news</h2>
          <label for="source">Posted by</label>
          <select id="source"><option>Admin</option><option>SSC</option></select>
          <label for="ntitle">Title</label>
          <input type="text" id="ntitle" required maxlength="120">
          <label for="nbody">Details</label>
          <textarea id="nbody" required></textarea>
          <button class="btn" type="submit">Post news</button>
        </form>
        <div><h2>Posted news</h2><div id="newsList"></div></div>
      </div>
    </div>

    <div class="tabpane hidden" id="tImg">
      <div class="admin-grid two">
        <form class="panel" id="imgForm">
          <h2>Post an image</h2>
          <label for="file">Image file</label>
          <input type="file" id="file" accept="image/*" required>
          <label for="caption">Caption (optional)</label>
          <input type="text" id="caption" maxlength="100">
          <button class="btn" type="submit" style="margin-top:14px">Post image</button>
        </form>
        <div><h2>Posted images</h2><div id="imgList"></div></div>
      </div>
    </div>
  </main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
